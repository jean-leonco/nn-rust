[package]
name = "nn-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.1"
cblas = "0.5.0"
image = "0.25.9"
rand = "0.10.2"
rand_distr = "0.6.0"
thiserror = "2.0.18"

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.14", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
blas-src = { version = "0.14", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["static"] }

[profile.release]
opt-level = 3
debug = true
